{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5 col-md-7">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="card-title text-center mb-4">Sign in</h2>
        <form method="post">
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <div class="input-group">
              <input class="form-control" id="password" name="password" type="password" required>
              <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('password', this)">Show</button>
            </div>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" id="admin" name="admin" type="checkbox">
            <label class="form-check-label" for="admin">Admin login</label>
          </div>
          <button class="btn btn-primary w-100" type="submit">Login</button>
        </form>
        <p class="text-center mt-3 mb-0">Need an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
