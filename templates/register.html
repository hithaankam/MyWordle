{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6 col-md-8">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="card-title text-center mb-4">Create account</h2>
        <form method="post">
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <div class="input-group">
              <input class="form-control" id="password" name="password" type="password" required>
              <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('password', this)">Show</button>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="confirm_password">Confirm password</label>
            <div class="input-group">
              <input class="form-control" id="confirm_password" name="confirm_password" type="password" required>
              <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('confirm_password', this)">Show</button>
            </div>
          </div>
          <button class="btn btn-success w-100" type="submit">Register</button>
        </form>
        <p class="text-center mt-3 mb-0">Already registered? <a href="{{ url_for('auth.login') }}">Login</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
